[workspace]
name = "stylegan-nada"
version = "0.1.0"
description = "StyleGAN-NADA Domain Adaptation"
channels = ["pytorch", "nvidia", "conda-forge"]
platforms = ["linux-64"]

[environments]
default = ["default"]
dev = ["default", "dev-tools"]

[dependencies]
python = "3.10.*"

pytorch = "==2.2.2"
torchvision = "==0.17.2"
pytorch-cuda = "==11.8"

cuda-nvcc = "11.8.*"
cuda-libraries-dev = "11.8.*"
cuda-cccl = "11.8.*"

gxx_linux-64 = "11.*"
sysroot_linux-64 = "==2.28"
ninja = "*"

numpy = "<2"
setuptools = ">=82.0.1,<83"
gdown = ">=6.1.0,<7"
pillow = ">=9.4.0,<10"
scipy = ">=1.15.2,<2"
dlib = ">=19.24.0,<20"

[pypi-dependencies]
click = "*"
requests = "*"
tqdm = "*"

pyspng = "*"
imageio-ffmpeg = "==0.4.3"
clip = { git = "https://github.com/openai/CLIP.git" }

[feature.dev-tools.dependencies]
ipykernel = "*"
ipywidgets = "*"
jupyter = "*"

[tasks]
notebook = { cmd = "jupyter notebook", "default-environment" = "dev" }
train = "python src/train.py"

[activation.env]
PYTHONHASHSEED = "101"
PYTHONPATH = ".:third_party/stylegan2:third_party/e4e"
